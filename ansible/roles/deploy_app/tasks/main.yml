---
# tasks file for deploy_app

- name: update cache
  ansible.builtin.apt:
    update_cache: yes
  when: ansible_os_family == "Debian"
  tags: always

- name: app folder directory create
  ansible.builtin.file:
    path: "{{ working_path }}"
    state: directory
    owner: "{{ user_owner }}"
    group: "{{ user_group }}"
    mode: "{{permission_mode}}"


- name: create own image from Dickerfile content
  community.docker.docker_image_build:
    name: "{{image_name}}"
    tag: "{{image_tag}}"
    path: "{{app_build_path}}"
    dockerfile: Dockerfile
  delegate_to: localhost
  run_once: true

## Log into a Docker registry
- name: Connection to private registry
  community.docker.docker_login:
    registry_url: "{{registry_url}}"
    username: "{{ lookup('ansible.builtin.env', 'REGISTRY_USER') }}"
    password: "{{ lookup('ansible.builtin.env', 'REGISTRY_TOKEN_HUB') }}"
  no_log: true

- name: push image created to private repository
  community.docker.docker_image_push:
    name: "{{image_name}}"
    tag: "{{image_tag}}"
  delegate_to: localhost



- name: Generate docker-compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ working_path }}/docker-compose.yml"
    owner: "{{ user_owner }}"
    group: "{{ user_group }}"

- name: set up templates .env.app
  ansible.builtin.template:
    src: env.app.j2
    dest: "{{ working_path }}/.env.app"  ## still in progress
    owner: "{{ user_owner }}"
    group: "{{ user_group }}"
    mode: '0600'


- name: set up templates .env.db
  ansible.builtin.template:
    src: env.db.j2
    dest: "{{ working_path }}/.env.db"  ## still in progress
    owner: "{{ user_owner }}"
    group: "{{ user_group }}"
    mode: '0600'


  
